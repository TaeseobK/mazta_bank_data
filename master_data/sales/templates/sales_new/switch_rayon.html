{% extends 'base/base_app.html' %}
{% load static %}

{% block main %}
<div class="mx-auto max-w-5xl">
    <form action="." method="post" class="panel panel-pad space-y-5">
        {% csrf_token %}
        <div class="flex flex-wrap items-end gap-4">
            <div class="field">
                <label for="rayon_asal" class="field-label">Rayon Asal</label>
                <select name="rayon_asal" id="rayon_asal" class="select select-sm w-56">
                    <option value="" selected>Pilih Rayon Asal</option>
                    {% for i in rayon %}<option value="{{ i.id }}">{{ i.rayon }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="rayon_tujuan" class="field-label">Rayon Tujuan</label>
                <select name="rayon_tujuan" id="rayon_tujuan" class="select select-sm w-56">
                    <option value="" selected>Pilih Rayon Tujuan</option>
                    {% for i in rayon %}<option value="{{ i.id }}">{{ i.rayon }}</option>{% endfor %}
                </select>
            </div>
            <button class="btn btn-sm btn-primary" type="submit">Submit</button>
        </div>

        <div class="flex flex-wrap items-center gap-4 border-t border-line pt-4">
            <label class="flex items-center gap-2 text-xs text-slate">
                <input id="check-all" name="check-all" type="checkbox" class="checkbox checkbox-sm"> Check all
            </label>
            <label class="input input-sm flex items-center gap-2 border-line">
                <span class="text-xs text-slate">Search</span>
                <input type="text" id="search-1" class="grow">
            </label>
        </div>

        <div id="data-grid" class="grid max-h-[28rem] grid-cols-2 gap-3 overflow-y-auto sm:grid-cols-3 lg:grid-cols-4"></div>
    </form>
</div>
{% endblock main %}
