{% extends 'base/base_app.html' %}
{% load static %}

{% block main %}
<section class="flex min-h-screen items-center justify-center px-4">
    <form action="." method="post" class="w-full max-w-sm">
        {% csrf_token %}
        <input type="hidden" name="metode" value="post">
        <div class="panel panel-pad space-y-6">
            <div class="space-y-1 text-center">
                <img src="{% static 'icon/mazta_logo.png' %}" alt="" class="mx-auto h-10 w-10 rounded-full bg-white p-1">
                <h1 class="text-lg font-semibold tracking-tight">PT Mazta Farma</h1>
                <p class="text-xs text-base-content/55">Doctor Priority Application</p>
            </div>

            <div class="space-y-3">
                <input type="text" id="username-id" name="username" autocomplete="off" class="input w-full" placeholder="Username">
                <input type="email" id="email-id" name="email" autocomplete="off" class="input w-full" placeholder="Email">
                <label class="input flex w-full items-center gap-2">
                    <input id="password-login" type="password" name="password" autocomplete="off" class="grow" placeholder="Password" required>
                    <label for="check-password" id="togglePassword" class="swap swap-rotate cursor-pointer">
                        <input type="checkbox" id="check-password" class="hidden">
                        <svg class="swap-on h-4 w-4 opacity-60" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6c0-1.2 4.03-6 9-6s9 4.8 9 6Z"/><path stroke="currentColor" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                        <svg class="swap-off h-4 w-4 opacity-60" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.933 13.909A4.357 4.357 0 0 1 3 12c0-1 4-6 9-6m7.6 3.8A5.068 5.068 0 0 1 21 12c0 1-3 6-9 6-.314 0-.62-.014-.918-.04M5 19 19 5m-4 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                    </label>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-full">Log In</button>

            <p class="text-center text-xs text-base-content/55">
                Can't log in? Contact our
                <a href="https://helpdesk-it.maztafarma.com/" target="_blank" class="text-primary">support team</a>.
            </p>
        </div>
    </form>
</section>
{% endblock main %}
