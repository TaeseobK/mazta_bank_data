{% extends 'base/list_base.html' %}

{% block table_head %}<th>Name</th>{% endblock %}

{% block table_body %}
{% for data in page_obj %}
<tr><th><a href="{% url 'master:detail_classification' data.pk %}">{{ data.name }}</a></th></tr>
{% endfor %}
{% endblock %}

{% block cards %}
{% for data in page_obj %}
<div class="p-4">
    <a href="{% url 'master:detail_classification' data.pk %}" class="text-sm font-medium text-primary">{{ data.name }}</a>
</div>
{% endfor %}
{% endblock %}
