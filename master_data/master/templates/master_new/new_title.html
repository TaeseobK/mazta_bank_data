{% extends 'base/form_base.html' %}

{% block heading %}New Title{% endblock %}

{% block fields %}
<div class="form-grid">
    <div class="field">
        <label for="gd-id" class="field-label">Full Title Name</label>
        <input type="text" id="gd-id" name="full-name" class="input w-full" placeholder="Title full name" required>
    </div>
    <div class="field">
        <label for="ga-id" class="field-label">Short Title Name</label>
        <input type="text" id="ga-id" name="short-name" class="input w-full" placeholder="Title short name" required>
    </div>
</div>
<div class="field">
    <label class="field-label">Description</label>
    <textarea name="description" class="textarea w-full"></textarea>
</div>
{% endblock %}
