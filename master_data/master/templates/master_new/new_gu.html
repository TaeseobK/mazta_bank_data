{% extends 'base/form_base.html' %}

{% block heading %}New Grade User{% endblock %}

{% block fields %}
<div class="form-grid">
    <div class="field">
        <label for="gd-id" class="field-label">Grade Name</label>
        <input type="text" id="gd-id" name="name" class="input w-full" value="Grade " placeholder="Grade name" required>
    </div>
    <div class="field">
        <label for="ga-id" class="field-label">Grade Alias</label>
        <input type="text" id="ga-id" name="alias" class="input w-full" placeholder="Grade alias" required>
    </div>
</div>

<div>
    <p class="section-label mb-3">Range User</p>
    <div class="form-grid">
        <div class="field">
            <label for="max-id" class="field-label">Max Value</label>
            <label class="input flex w-full items-center gap-2">
                <input type="number" id="max-id" name="max-value" class="grow" required>
                <select name="max-measure" class="select select-ghost select-sm w-28" required>
                    <option value="" selected disabled>Measure</option>
                    <option value="Thousand">Thousand</option>
                    <option value="Million">Million</option>
                    <option value="Billion">Billion</option>
                </select>
            </label>
        </div>
        <div class="field">
            <label for="min-id" class="field-label">Min Value</label>
            <label class="input flex w-full items-center gap-2">
                <input type="number" id="min-id" name="min-value" class="grow" required>
                <select name="min-measure" class="select select-ghost select-sm w-28" required>
                    <option value="" selected disabled>Measure</option>
                    <option value="Thousand">Thousand</option>
                    <option value="Million">Million</option>
                    <option value="Billion">Billion</option>
                </select>
            </label>
        </div>
    </div>
</div>

<div class="field">
    <label class="field-label">Description</label>
    <textarea name="description" class="textarea w-full"></textarea>
</div>
{% endblock %}
