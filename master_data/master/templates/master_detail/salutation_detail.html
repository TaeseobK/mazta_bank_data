{% extends 'base/form_detail_base.html' %}

{% block heading %}Salutation Detail{% endblock %}

{% block fields %}
<div class="form-grid">
    <div class="field-row">
        <label for="gd-id" class="field-label">Full</label>
        <input type="text" id="gd-id" name="full-name" value="{{ data.salutation }}" class="input w-full" placeholder="Salutation full name" required>
    </div>
    <div class="field-row">
        <label for="ga-id" class="field-label">Short</label>
        <input type="text" id="ga-id" name="short-name" value="{{ data.short_salutation }}" class="input w-full" placeholder="Salutation short name" required>
    </div>
</div>
<div class="field-row">
    <label class="field-label">Description</label>
    <textarea name="description" class="textarea w-full">{{ data.description }}</textarea>
</div>
{% endblock %}
