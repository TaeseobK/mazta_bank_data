[project]
name = "pusatdata"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.2,<6.1",
    "django-browser-reload>=1.21.0",   # unconditionally in INSTALLED_APPS/MIDDLEWARE
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",                 # pandas .xlsx engine in sales/.../save_db.py
    "pillow>=11.0.0",                  # required by ImageField (master.Profile, sales.Visits)
    "requests>=2.32.4",                # CVE-2024-47081 (.netrc credential leak)
    "python-decouple>=3.8",
    "psycopg2>=2.9.10",                # DB driver, selected via DB_*_ENGINE
    "mysqlclient>=2.2.8",              # DB driver, selected via DB_*_ENGINE
    # transitive security floors (resolver would otherwise keep stale pins):
    "urllib3>=2.5.0",
    "certifi>=2024.7.4",
    "idna>=3.7",
]
[tool.uv]
environments = ["sys_platform == 'linux'"]
